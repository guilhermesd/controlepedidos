name: SonarQube

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar-community:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Instalar dependências
      run: sudo apt-get update && sudo apt-get install -y curl jq

    - name: Esperar SonarQube iniciar
      run: |
        echo "Esperando SonarQube ficar disponível..."
        until curl -s http://localhost:9000 > /dev/null; do sleep 5; done

    - name: Gerar token admin SonarQube
      run: |
        TOKEN=$(curl -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=default-token" | jq -r '.token')
        echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV

    - name: Criar Quality Gate com 70% de cobertura
      run: |
        curl -s -u admin:$SONAR_TOKEN -X POST "http://localhost:9000/api/qualitygates/create?name=Gate70"
        curl -s -u admin:$SONAR_TOKEN -X POST "http://localhost:9000/api/qualitygates/create_condition" \
          -d "gateName=Gate70" \
          -d "metric=coverage" \
          -d "op=LT" \
          -d "error=70" \
          -d "type=INT"

    - name: Aplicar Quality Gate ao projeto
      run: |
        curl -s -u admin:$SONAR_TOKEN \
          -X POST "http://localhost:9000/api/qualitygates/select" \
          -d "projectKey=my-project-key" \
          -d "gateName=Gate70"

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Run tests with coverage
      run: dotnet test --configuration Release --collect:"XPlat Code Coverage"

    - name: Begin SonarQube analysis
      run: |
        dotnet tool install --global dotnet-sonarscanner
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet sonarscanner begin \
          /k:"my-project-key" \
          /d:sonar.host.url="http://localhost:9000" \
          /d:sonar.login="$SONAR_TOKEN" \
          /d:sonar.cs.coverage.reportPaths="**/TestResults/**/coverage.cobertura.xml"

    - name: Build project
      run: dotnet build --no-restore --configuration Release

    - name: End SonarQube analysis
      run: dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"
