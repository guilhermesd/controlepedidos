name: Quality Gate com SonarQube

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    name: Verificar cobertura com SonarQube
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: http://localhost:9000
      PROJECT_KEY: my-project-key

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências do .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar pacotes
        run: dotnet restore

      - name: Rodar testes com cobertura
        run: dotnet test --collect:"XPlat Code Coverage"

      - name: Instalar dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Rodar análise com SonarScanner
        run: |
          dotnet sonarscanner begin /k:"$PROJECT_KEY" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.login="$SONAR_TOKEN"
          dotnet build
          dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"

      - name: Esperar análise terminar e verificar Quality Gate
        run: |
          echo "Esperando status da Quality Gate..."

          # Buscar analysisId da última análise concluída
          analysisId=$(curl -s -u $SONAR_TOKEN: "$SONAR_HOST_URL/api/project_analyses/search?project=$PROJECT_KEY" | jq -r '.analyses[0].analysis')

          echo "Último analysisId: $analysisId"

          # Esperar até que o status seja disponível
          qualityGateStatus=""
          ATTEMPTS=0
          MAX_ATTEMPTS=10

          while [[ -z "$qualityGateStatus" && $ATTEMPTS -lt $MAX_ATTEMPTS ]]; do
            sleep 3
            qualityGateStatus=$(curl -s -u $SONAR_TOKEN: "$SONAR_HOST_URL/api/qualitygates/project_status?analysisId=$analysisId" | jq -r '.projectStatus.status // empty')
            echo "Tentativa $((ATTEMPTS+1)): Status da Quality Gate: ${qualityGateStatus:-vazio}"
            ATTEMPTS=$((ATTEMPTS + 1))
          done

          if [[ "$qualityGateStatus" != "OK" ]]; then
            echo "❌ Quality Gate falhou ou não pôde ser verificada."
            exit 1
          fi

          echo "✅ Quality Gate OK!"
