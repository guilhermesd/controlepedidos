name: Build, Test, SonarQube Analysis and Push Docker image to Amazon ECR

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: latest
      SONAR_PROJECT_KEY: your-sonar-project-key
      SONAR_ORGANIZATION: your-sonar-organization
      SONAR_HOST_URL: "http://localhost:9000"  # O SonarQube estará rodando no container local

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # importante para SonarQube detectar SCM

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Setup Java (para SonarScanner)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Restore dependencies
      run: dotnet restore

    - name: Run tests with XPlat Code Coverage
      run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

    - name: Install SonarScanner
      run: |
        curl -sSLo sonarscanner.zip https://binaries.sonarsource.com/Commercial/sonar-scanner-cli-4.7.0.2747-linux.zip
        unzip sonarscanner.zip -d /usr/local
        export PATH=$PATH:/usr/local/sonar-scanner-4.7.0.2747-linux/bin

    - name: Start SonarQube container
      run: |
        docker run -d --name sonarqube -p 9000:9000 sonarqube:community

    - name: Wait for SonarQube to be ready
      run: |
        echo "Waiting for SonarQube to be ready..."
        for i in {1..30}; do
          if curl -s http://localhost:9000 | grep "SonarQube"; then
            echo "SonarQube is ready!"
            break
          else
            echo "Waiting for SonarQube..."
            sleep 10
          fi
        done

    - name: Create/Update SonarQube Quality Gate (70% coverage)
      run: |
        curl -X POST "${{ env.SONAR_HOST_URL }}/api/qualitygates/create" \
          -d "name=Custom Quality Gate" \
          -d "conditions[0].metric=coverage" \
          -d "conditions[0].operator=GREATER_THAN" \
          -d "conditions[0].value=70"
        curl -X POST "${{ env.SONAR_HOST_URL }}/api/qualitygates/select" \
          -d "projectKey=${{ env.SONAR_PROJECT_KEY }}" \
          -d "qualityGate=Custom Quality Gate"

    - name: Begin SonarQube analysis
      run: |
        sonar-scanner \
          -Dsonar.projectKey="${{ env.SONAR_PROJECT_KEY }}" \
          -Dsonar.sources=. \
          -Dsonar.host.url="${{ env.SONAR_HOST_URL }}" \
          -Dsonar.cs.coverage.reportPaths="**/TestResults/**/coverage.cobertura.xml" \
          -Dsonar.coverage.exclusions="**/Migrations/**,**/*.Tests/**"

    - name: Build project
      run: dotnet build --no-restore --configuration Release

    - name: End SonarQube analysis
      run: |
        sonar-scanner end

    - name: Check SonarQube Quality Gate status
      id: qualitygate
      uses: sonarsource/sonarcloud-github-action@master

    - name: Fail if Quality Gate fails
      if: steps.qualitygate.outputs.qualitygate != 'PASS'
      run: |
        echo "Quality Gate failed, stopping the workflow."
        exit 1

    - name: Stop and remove SonarQube container
      run: |
        docker stop sonarqube
        docker rm sonarqube

    # Deploy Docker somente em push no main
    - name: Configure AWS credentials
      if: github.event_name == 'push'
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      if: github.event_name == 'push'
      uses: aws-actions/amazon-ecr-login@v1

    - name: Create ECR repositories if not exist
      if: github.event_name == 'push'
      run: |
        aws ecr describe-repositories --repository-names pedidos-repo || aws ecr create-repository --repository-name pedidos-repo
        aws ecr describe-repositories --repository-names migration-repo || aws ecr create-repository --repository-name migration-repo

    - name: Build Docker image
      if: github.event_name == 'push'
      run: |
        docker build -f Api/Dockerfile -t pedidos:${{ env.IMAGE_TAG }} .
        docker build -f Api/Dockerfile.migrations -t migrations:${{ env.IMAGE_TAG }} .

    - name: Tag Docker image
      if: github.event_name == 'push'
      run: |
        docker tag pedidos:${{ env.IMAGE_TAG }} 439667737553.dkr.ecr.us-east-1.amazonaws.com/pedidos-repo:${{ env.IMAGE_TAG }}
        docker tag migrations:${{ env.IMAGE_TAG }} 439667737553.dkr.ecr.us-east-1.amazonaws.com/migration-repo:${{ env.IMAGE_TAG }}

    - name: Push to Amazon ECR
      if: github.event_name == 'push'
      run: |
        docker push 439667737553.dkr.ecr.us-east-1.amazonaws.com/pedidos-repo:${{ env.IMAGE_TAG }}
        docker push 439667737553.dkr.ecr.us-east-1.amazonaws.com/migration-repo:${{ env.IMAGE_TAG }}
